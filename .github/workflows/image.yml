name: Publish image (explicit release only)
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GHCR after owner approval'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          tags: ghcr.io/${{ github.repository }}:0.1.0
          provenance: true
          sbom: true
